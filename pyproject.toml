[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymsgkit"
version = "1.2.0"
description = "Pure Python library for creating Outlook MSG files (plus EML/MBOX export)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["msg", "outlook", "email", "mapi", "ediscovery", "forensics", "eml", "mbox"]
authors = [
  {name = "PyMsgKit Contributors"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# Only needed to run the test suite; the library itself is dependency-free.
test = ["pytest>=7", "olefile>=0.46"]
# Optional: validate output against the forensic-standard MSG parser. The
# forensic-validation tests are skipped automatically if this is not installed.
validate = ["extract-msg"]

[project.urls]
Homepage = "https://github.com/yourusername/pymsgkit"
Documentation = "https://github.com/yourusername/pymsgkit#readme"
Repository = "https://github.com/yourusername/pymsgkit"
Issues = "https://github.com/yourusername/pymsgkit/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
